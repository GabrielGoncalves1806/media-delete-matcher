name: media_swipe
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Fontes do design, embutidas (a build de release não tem permissão de internet).
  # Licença OFL em assets/fonts/OFL-*.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700
